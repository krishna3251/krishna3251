name: Profile refresh

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/**
      - tests/**
      - requirements.txt
      - .github/workflows/profile.yml
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: profile-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate profile
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate.py
      - name: Check live public API and generated assets
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/profile.py
          python scripts/validate.py

  refresh:
    name: Publish current activity
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Refresh public account data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/profile.py
          python scripts/validate.py
      - name: Commit generated assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/activity.svg assets/activity.json assets/contributions.gif
          if git diff --cached --quiet; then
            echo 'Profile is already current.'
            exit 0
          fi
          git commit -m 'chore: refresh public profile activity'
          # Rebase generated-only changes; never overwrite concurrent hand edits.
          git pull --rebase origin main
          git push origin HEAD:main
